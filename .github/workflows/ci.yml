# This repo is backend + ocr-service. The Node job below covers the backend only;
# ocr-service/ has its own pytest suite and no workflow yet.
name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock
          POSTGRES_PASSWORD: stock
          POSTGRES_DB: stock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stock -d stock_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://stock:stock@localhost:5432/stock_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-32-characters-min-xxxxx
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-min-xxxx
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        env:
          PGPASSWORD: stock
        run: |
          # 006-test-framework needs the pgTAP extension, which the postgres:16-alpine
          # service image lacks; the app schema doesn't depend on it.
          for f in $(ls migrations/deploy/*.sql | sort | grep -v 006-test-framework); do
            echo "== $f"
            psql -h localhost -U stock -d stock_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run test:e2e
